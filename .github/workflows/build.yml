name: Build and Test

on:
  push:
    branches: [ main, dynamic-workflow-* ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plan_docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plan_docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore PerformerIdentifier.slnx

    - name: Build
      run: dotnet build PerformerIdentifier.slnx --no-restore

    - name: Test
      run: dotnet test PerformerIdentifier.slnx --no-build --verbosity normal --collect:"XPlat Code Coverage"
